name: Web checks
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/web-checks.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/web-checks.yml"
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
