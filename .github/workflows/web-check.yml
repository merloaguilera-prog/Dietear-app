name: Web checks

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - "playwright.config.mjs"
      - ".github/workflows/web-check.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - "playwright.config.mjs"
      - ".github/workflows/web-check.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise web and Android-sized screens
        run: npm run test:e2e
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dietear-web-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
